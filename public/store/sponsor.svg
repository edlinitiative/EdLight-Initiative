<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Sponsor a Student Kit">
  <!-- Background: deep navy gradient with subtle paper grain -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001a4d"/>
      <stop offset="55%" stop-color="#00102e"/>
      <stop offset="100%" stop-color="#000a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#1e429f" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1e429f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e8e2d4" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <rect width="800" height="800" fill="url(#dots)"/>

  <!-- Outer frame / kit silhouette: a soft package outline centered -->
  <g transform="translate(400 400)">
    <!-- Package box -->
    <rect x="-220" y="-220" width="440" height="440" rx="18"
          fill="url(#badge)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <!-- Inner hairline frame -->
    <rect x="-200" y="-200" width="400" height="400" rx="10"
          fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

    <!-- "Tag" string at top -->
    <line x1="0" y1="-260" x2="0" y2="-220" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="0" cy="-264" r="4" fill="#ffffff" fill-opacity="0.3"/>

    <!-- Iconography: open book + sun = the EdLight metaphor -->
    <g transform="translate(0 -50)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Book spread -->
      <path d="M -110 30 C -75 10, -25 10, 0 25 C 25 10, 75 10, 110 30 L 110 100 C 75 80, 25 80, 0 95 C -25 80, -75 80, -110 100 Z"/>
      <line x1="0" y1="25" x2="0" y2="95"/>
      <!-- Page lines (subtle) -->
      <line x1="-90" y1="45" x2="-25" y2="40" stroke-opacity="0.45"/>
      <line x1="-90" y1="60" x2="-25" y2="55" stroke-opacity="0.45"/>
      <line x1="-90" y1="75" x2="-30" y2="70" stroke-opacity="0.45"/>
      <line x1="25" y1="40" x2="90" y2="45" stroke-opacity="0.45"/>
      <line x1="25" y1="55" x2="90" y2="60" stroke-opacity="0.45"/>
      <line x1="30" y1="70" x2="90" y2="75" stroke-opacity="0.45"/>

      <!-- Sun / light above the book -->
      <circle cx="0" cy="-30" r="22" fill="#ffffff" fill-opacity="0.95" stroke="none"/>
      <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="3">
        <line x1="0" y1="-72" x2="0" y2="-62"/>
        <line x1="0" y1="2" x2="0" y2="12"/>
        <line x1="-42" y1="-30" x2="-32" y2="-30"/>
        <line x1="32" y1="-30" x2="42" y2="-30"/>
        <line x1="-30" y1="-60" x2="-23" y2="-53"/>
        <line x1="23" y1="-53" x2="30" y2="-60"/>
        <line x1="-30" y1="0" x2="-23" y2="-7"/>
        <line x1="23" y1="-7" x2="30" y2="0"/>
      </g>
    </g>

    <!-- Kit contents row: pencil + ruler + apple silhouettes as small chips -->
    <g transform="translate(0 145)">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
        <!-- Pencil -->
        <g transform="translate(-90 0)">
          <rect x="-26" y="-6" width="44" height="12" rx="2"/>
          <polygon points="18,-6 30,0 18,6" fill="#ffffff" fill-opacity="0.55" stroke="none"/>
          <line x1="-26" y1="-6" x2="-22" y2="-6"/>
        </g>
        <!-- Notebook -->
        <g transform="translate(0 0)">
          <rect x="-18" y="-14" width="36" height="28" rx="2"/>
          <line x1="-12" y1="-6" x2="12" y2="-6"/>
          <line x1="-12" y1="0" x2="12" y2="0"/>
          <line x1="-12" y1="6" x2="6" y2="6"/>
        </g>
        <!-- Heart (the "sponsor" gesture) -->
        <g transform="translate(90 0)">
          <path d="M 0 12 C -18 -2, -22 -16, -10 -16 C -4 -16, 0 -10, 0 -6 C 0 -10, 4 -16, 10 -16 C 22 -16, 18 -2, 0 12 Z"
                fill="#ffffff" fill-opacity="0.55" stroke="none"/>
        </g>
      </g>
    </g>
  </g>

  <!-- "EdLight" wordmark bottom-left -->
  <g transform="translate(60 720)" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">
    <text x="0" y="0" fill="#ffffff" fill-opacity="0.9" font-size="22" font-weight="600" letter-spacing="0.5">EdLight</text>
    <text x="0" y="22" fill="#ffffff" fill-opacity="0.55" font-size="11" font-weight="500" letter-spacing="2.5" text-transform="uppercase">SPONSOR · A · STUDENT</text>
  </g>

  <!-- Small label top-right -->
  <g transform="translate(740 70)" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace">
    <text x="0" y="0" fill="#ffffff" fill-opacity="0.5" font-size="11" letter-spacing="1.5">KIT · 01</text>
  </g>
</svg>
